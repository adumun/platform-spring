adumun:
  resilience:
    dependencies:
      catalog:
        idempotent: true
        retry:
          enabled: true
          max-attempts: 3
          initial-backoff: 25ms
          multiplier: 2.0
          jitter: 0.1
        circuit-breaker:
          enabled: true
          failure-rate-threshold: 50
          minimum-number-of-calls: 2
          sliding-window-size: 4
          open-state-duration: 250ms
        bulkhead:
          enabled: true
          max-concurrent-calls: 2
          max-wait-duration: 0ms
        timeout:
          enabled: true
          duration: 500ms
