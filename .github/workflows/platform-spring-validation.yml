name: Platform Spring Validation

on:
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Record the effective PR merge SHA, not just the source branch.
      - name: Environment
        run: |
          git rev-parse HEAD
          java -version
          ./mvnw -version
          docker version
          docker info
          docker compose version
      - name: Dependencies
        run: make deps
      - name: Validation
        run: make validate VERBOSE=1
      - name: Consumer onboarding
        run: make onboarding VERBOSE=1
